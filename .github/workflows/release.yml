name: Release Mobile Apps (Android & iOS)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      api_base_url:
        description: 'Production Vercel API base URL'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Release Android (APK & AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Ensure Gradle wrapper binaries
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create --platforms=android --org com.lupinmovies --project-name lupin_movies /tmp/flutter_android_tpl
            cp /tmp/flutter_android_tpl/android/gradlew android/
            cp /tmp/flutter_android_tpl/android/gradlew.bat android/
            mkdir -p android/gradle/wrapper
            cp /tmp/flutter_android_tpl/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/
            chmod +x android/gradlew
            rm -rf /tmp/flutter_android_tpl
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Configure release keystore (if secrets exist)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_STORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "::warning::Release keystore secrets missing; APK/AAB signed with debug fallback key."
          fi

      - name: Build Android APK & AAB
        env:
          INPUT_URL: ${{ github.event.inputs.api_base_url }}
          VAR_URL: ${{ vars.API_BASE_URL }}
        run: |
          API_URL="${INPUT_URL:-${VAR_URL:-https://ais-pre-n3i22csvzas34xba3x2pvl-986205634764.europe-west2.run.app}}"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"
          flutter build appbundle --release --dart-define=API_BASE_URL="$API_URL"
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/lupin-movies-android.apk
          cp build/app/outputs/bundle/release/app-release.aab release-assets/lupin-movies-android.aab

      - if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: release-android-assets
          path: mobile/release-assets/*

  build-ios:
    name: Build Release iOS (IPA)
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - working-directory: mobile/ios
        run: pod install --repo-update

      - name: Build signed IPA when Apple Developer secrets are configured
        env:
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
          INPUT_URL: ${{ github.event.inputs.api_base_url }}
          VAR_URL: ${{ vars.API_BASE_URL }}
        run: |
          API_URL="${INPUT_URL:-${VAR_URL:-https://ais-pre-n3i22csvzas34xba3x2pvl-986205634764.europe-west2.run.app}}"
          mkdir -p release-assets
          if [ -n "$IOS_BUILD_CERTIFICATE_BASE64" ] && [ -n "$IOS_P12_PASSWORD" ] && [ -n "$IOS_PROVISION_PROFILE_BASE64" ] && [ -n "$IOS_TEAM_ID" ]; then
            KEYCHAIN_PASS="${IOS_KEYCHAIN_PASSWORD:-ci-temp-keychain-pass}"
            CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
            PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

            echo "$IOS_BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
            echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
            cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

            EXPORT_METHOD="${IOS_EXPORT_METHOD:-app-store-connect}"
            cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.lupinmovies.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

            flutter build ipa --release \
              --export-options-plist=ios/ExportOptions.plist \
              --dart-define=API_BASE_URL="$API_URL"
            cp build/ios/ipa/*.ipa release-assets/lupin-movies-ios.ipa
          else
            echo "::warning::Apple signing secrets missing; producing unsigned Runner.app archive only."
            flutter build ios --release --no-codesign --dart-define=API_BASE_URL="$API_URL"
            ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app release-assets/lupin-movies-ios-unsigned.app.zip
          fi

      - if: always()
        run: |
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build_profile.mobileprovision" ios/ExportOptions.plist
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-ios-assets
          path: mobile/release-assets/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "LUPIN MOVIES ${{ steps.tag.outputs.tag_name }}"
          generate_release_notes: true
          files: |
            artifacts/release-android-assets/*
            artifacts/release-ios-assets/*
