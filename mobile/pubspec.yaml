name: lupin_movies
description: "LUPIN MOVIES — Six-edition mobile cinema, anime, live TV, sports, wrestling & novels streaming platform for Android and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  video_player: ^2.9.2
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  wakelock_plus: ^1.2.8
  package_info_plus: ^8.1.1
  path_provider: ^2.1.4
  sqflite: ^2.3.3+1
  path: ^1.9.0
  crypto: ^3.0.5
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/images/splash_logo.png
    - assets/images/cinema_hero.jpg
    - assets/images/anime_showcase.jpg
    - assets/images/sports_arena.jpg
    - assets/images/novel_cover.jpg
